# GitLab Duo Chat → OpenAI API Proxy — config (gitlab-autoreg deployment)
# Model refs VERIFIED LIVE 2026-09-22 via aiChatAvailableModels on card-verified account
# (57 models: glar_stage/duo_models.json). Refs are snake_case ids, NOT provider/model.

server:
  host: "127.0.0.1"
  port: 8088
  debug: false
  tools: true       # gateway executes whitelisted tools (bash/read/write/...) on this PC

gitlab:
  base_url: "https://gitlab.com"
  auth_type: "cookie"
  auth_value: ""            # optional single-account fallback; pool is primary
  graphql_endpoint: "/api/graphql"
  timeout: 120
  default_model: "astra-6"
  admin_pat: ""
  duo_namespace_gid: "gid://gitlab/Group/144232371"

pool:
  enabled: true
  strategy: "round_robin"
  cooldown_seconds: 60
  max_failures: 3
  retry_count: 3
  invalid_on_auth_error: true
  webui_token: "CHANGE_ME"

smtp:
  host: ""
  port: 465
  user: ""
  password: ""
  sender: ""
  timeout: 15

